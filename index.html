<!-- पुराना कोड हटाकर इसे अपनी index.html में पेस्ट करें -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShorts Pro</title>
    <!-- प्रोफेशनल लुक के लिए Tailwind CSS और FontAwesome का इस्तेमाल -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .video-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: calc(100vh - 60px); }
        .video-card { scroll-snap-align: start; height: calc(100vh - 60px); position: relative; }
    </style>
</head>
<body>

    <!-- टॉप बार (Premium Look) -->
    <div class="fixed top-0 left-0 right-0 h-14 bg-gradient-to-b from-black/80 to-transparent z-50 flex justify-between items-center px-4">
        <h1 class="text-xl font-bold tracking-wider text-red-600">Mini<span class="text-white">Shorts</span></h1>
        <i class="fas fa-camera text-xl cursor-pointer"></i>
    </div>

    <!-- वीडियो फीड एरिया -->
    <div class="video-container" id="feed">
        <!-- वीडियो कार्ड 1 -->
        <div class="video-card flex items-center justify-center bg-zinc-900">
            <video class="w-full h-full object-cover" loop autoplay muted src="https://mixkit.co"></video>
            
            <!-- साइड एक्शन बटन्स (लाइक, कमेंट, शेयर) -->
            <div class="absolute right-4 bottom-24 flex flex-col items-center gap-6 z-40">
                <div class="flex flex-col items-center cursor-pointer" onclick="toggleLike(this)">
                    <i class="fas fa-heart text-2xl text-white transition-colors duration-200"></i>
                    <span class="text-xs mt-1">1.2K</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer">
                    <i class="fas fa-comment text-2xl"></i>
                    <span class="text-xs mt-1">45</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer">
                    <i class="fas fa-share text-2xl"></i>
                    <span class="text-xs mt-1">Share</span>
                </div>
            </div>

            <!-- वीडियो डिटेल्स -->
            <div class="absolute bottom-4 left-4 right-16 z-40 bg-gradient-to-t from-black/60 to-transparent p-2 rounded">
                <p class="font-semibold text-sm">@creators_hub</p>
                <p class="text-xs text-zinc-300 mt-1">Check out this amazing neon vibes! #trending #shorts</p>
            </div>
        </div>
    </div>

    <!-- बॉटम नेविगेशन बार (बिल्कुल YouTube Shorts जैसा प्रोफेशनल) -->
    <div class="fixed bottom-0 left-0 right-0 h-16 bg-black border-t border-zinc-800 flex justify-around items-center z-50">
        <button class="flex flex-col items-center text-red-500" onclick="changeTab('home')">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </button>
        <button class="flex flex-col items-center text-zinc-400" onclick="changeTab('trends')">
            <i class="fas fa-fire text-lg"></i>
            <span class="text-[10px] mt-0.5">Trending</span>
        </button>
        <button class="flex flex-col items-center bg-white text-black px-4 py-1.5 rounded-full font-bold text-lg hover:scale-105 transition">
            <i class="fas fa-plus"></i>
        </button>
        <button class="flex flex-col items-center text-zinc-400" onclick="changeTab('search')">
            <i class="fas fa-search text-lg"></i>
            <span class="text-[10px] mt-0.5">Discover</span>
        </button>
        <button class="flex flex-col items-center text-zinc-400" onclick="changeTab('profile')">
            <i class="fas fa-user text-lg"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </button>
    </div>

    <!-- बटन्स को वर्किंग बनाने की स्क्रिप्ट -->
    <script>
        function toggleLike(element) {
            const icon = element.querySelector('i');
            icon.classList.toggle('text-red-500');
            icon.classList.toggle('text-white');
        }

        function changeTab(tabName) {
            alert(tabName.toUpperCase() + " सेक्शन लोड हो रहा है...");
            // यहाँ हम भविष्य में अलग पेज या डेटा लोड करवा सकते हैं
        }
    </script>
</body>
</html>
