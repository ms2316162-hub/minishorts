<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShorts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; }
        .app-container { width: 100vw; height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; scroll-behavior: smooth; }
        .video-slide { width: 100vw; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: linear-gradient(180deg, #ff4081 0%, #000 100%); }
        .brand-header { position: absolute; top: 20px; left: 20px; font-size: 28px; font-weight: bold; color: #fff; z-index: 10; text-shadow: 2px 2px 10px #ff4081; }
        .side-bar { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 25px; z-index: 10; }
        .icon { width: 50px; height: 50px; background: rgba(255, 64, 129, 0.3); border: 2px solid #ff4081; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .ad-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; display: none; }
        .ad-box { padding: 30px; background: linear-gradient(135deg, #ff4081, #9c27b0); border-radius: 15px; text-align: center; border: 3px solid #fff; width: 85%; }
        .ad-timer { font-size: 24px; font-weight: bold; margin-top: 15px; color: #fff; background: #000; padding: 10px; border-radius: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="brand-header">MiniShorts</div>
    <div id="adOverlay" class="ad-overlay"><div class="ad-box"><h2>MiniShorts Ad</h2><p style="margin-top:10px;">Wait 5 seconds to unlock scrolling...</p><div id="timer" class="ad-timer">5</div></div></div>
    <div class="app-container" id="videoContainer">
        <div class="video-slide"><h1>🎬 Slide 1</h1><div class="side-bar"><div class="icon">❤️</div><div class="icon">💬</div><div class="icon">🔄</div></div></div>
        <div class="video-slide"><h1>🎬 Slide 2</h1><div class="side-bar"><div class="icon">❤️</div><div class="icon">💬</div><div class="icon">🔄</div></div></div>
        <div class="video-slide"><h1>🎬 Slide 3</h1><div class="side-bar"><div class="icon">❤️</div><div class="icon">💬</div><div class="icon">🔄</div></div></div>
        <div class="video-slide"><h1>🎬 Slide 4</h1><div class="side-bar"><div class="icon">❤️</div><div class="icon">💬</div><div class="icon">🔄</div></div></div>
        <div class="video-slide"><h1>🎬 Slide 5</h1><div class="side-bar"><div class="icon">❤️</div><div class="icon">💬</div><div class="icon">🔄</div></div></div>
        <div class="video-slide"><h1>🚀 Slide 6 (Unlocked)</h1><div class="side-bar"><div class="icon">❤️</div><div class="icon">💬</div><div class="icon">🔄</div></div></div>
    </div>
    <script>
        const container = document.getElementById('videoContainer');
        const adOverlay = document.getElementById('adOverlay');
        const timerElement = document.getElementById('timer');
        let adTriggered = false;
        container.addEventListener('scroll', () => {
            let slideIndex = Math.round(container.scrollTop / window.innerHeight);
            if (slideIndex === 4 && !adTriggered) {
                adTriggered = true;
                adOverlay.style.display = 'flex';
                container.style.overflowY = 'hidden';
                let timeLeft = 5;
                let countdown = setInterval(() => {
                    timeLeft--;
                    timerElement.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        adOverlay.style.display = 'none';
                        container.style.overflowY = 'scroll';
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
